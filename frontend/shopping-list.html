<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shopping List - Flavora</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Inter:wght@300;400;500;600&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/styles.css">
</head>
<body class="d-flex flex-column min-vh-100">

    <nav class="navbar navbar-expand-lg navbar-custom py-3 border-bottom">
        <div class="container-fluid px-4">
            <a class="navbar-brand d-flex align-items-center gap-2" href="index.html">
                <i class="fa-solid fa-leaf"></i> Flavora
            </a>
            <ul class="navbar-nav ms-auto align-items-center">
                <li class="nav-item"><a class="nav-link" href="dashboard.html">Dashboard</a></li>
            </ul>
        </div>
    </nav>

    <div class="container py-5 flex-grow-1" style="max-width: 600px;">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2 class="fw-bold">Shopping List</h2>
            <button class="btn btn-outline-danger btn-sm" onclick="clearPurchased()"><i class="fa-solid fa-broom me-2"></i>Clear Purchased</button>
        </div>

        <div class="glass-card p-4 mb-4">
            <form id="addItemForm" class="d-flex gap-2">
                <input type="text" class="form-control" id="ingredientName" placeholder="Add an ingredient..." required>
                <input type="text" class="form-control" id="ingredientQty" placeholder="Qty" style="width: 100px;">
                <button type="submit" class="btn btn-primary-custom"><i class="fa-solid fa-plus"></i></button>
            </form>
        </div>

        <div class="glass-card p-0 overflow-hidden">
            <ul class="list-group list-group-flush" id="shoppingList">
                <li class="list-group-item text-center py-4 text-muted">Loading...</li>
            </ul>
        </div>
    </div>

    <!-- Toast Container -->
    <div class="toast-container position-fixed bottom-0 end-0 p-3" id="toast-container"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script src="js/api.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            if (!localStorage.getItem('token')) {
                window.location.href = 'auth.html';
                return;
            }
            loadItems();
        });

        document.getElementById('addItemForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const ingredient = document.getElementById('ingredientName').value;
            const quantity = document.getElementById('ingredientQty').value;
            
            try {
                await api.shoppingList.add({ ingredient, quantity });
                document.getElementById('ingredientName').value = '';
                document.getElementById('ingredientQty').value = '';
                loadItems();
            } catch(err) {
                showToast('Failed to add item', 'danger');
            }
        });

        async function loadItems() {
            const container = document.getElementById('shoppingList');
            try {
                const res = await api.shoppingList.getAll();
                const items = res.data;

                container.innerHTML = '';
                if (items.length === 0) {
                    container.innerHTML = `<li class="list-group-item text-center py-4 text-muted border-0">Your shopping list is empty.</li>`;
                    return;
                }

                items.forEach(item => {
                    const checked = item.purchased ? 'checked' : '';
                    const lineThrough = item.purchased ? 'text-decoration-line-through text-muted' : '';
                    container.innerHTML += `
                        <li class="list-group-item d-flex justify-content-between align-items-center p-3">
                            <div class="form-check d-flex align-items-center gap-3">
                                <input class="form-check-input mt-0 fs-5" type="checkbox" ${checked} onchange="toggleItem(${item.id}, this.checked)">
                                <label class="form-check-label mb-0 fs-5 ${lineThrough}">
                                    ${item.ingredient} ${item.quantity ? `<span class="badge bg-secondary ms-2">${item.quantity}</span>` : ''}
                                </label>
                            </div>
                            <button class="btn btn-sm btn-outline-danger border-0" onclick="deleteItem(${item.id})"><i class="fa-solid fa-trash"></i></button>
                        </li>
                    `;
                });
            } catch (err) {
                console.error(err);
                showToast('Error loading list', 'danger');
            }
        }

        async function toggleItem(id, purchased) {
            try {
                await api.shoppingList.update(id, purchased);
                loadItems();
            } catch(err) {
                showToast('Update failed', 'danger');
            }
        }

        async function deleteItem(id) {
            try {
                await api.shoppingList.delete(id);
                loadItems();
            } catch(err) {
                showToast('Delete failed', 'danger');
            }
        }

        async function clearPurchased() {
            try {
                await api.shoppingList.clearPurchased();
                loadItems();
            } catch(err) {
                showToast('Clear failed', 'danger');
            }
        }
    </script>
</body>
</html>
